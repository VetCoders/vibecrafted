# Canonical Vibecrafted terminal host policy.
# Vibecrafted.app loads this file explicitly and never imports or mutates the
# user's Alacritty configuration.
[general]
live_config_reload = true

[terminal]
# The app passes the generation-bound primary-shell path with `-e`. This
# fallback gives the standalone vc-terminal launcher the identical chain.
shell = { program = "/bin/zsh", args = ["-lc", "exec \"$VIBECRAFTED_RUNTIME_ROOT/config/alacritty/launch-primary-shell.zsh\" \"$VIBECRAFTED_RUNTIME_ROOT/bin/vc-start\" operator"] }

[window]
blur = true
opacity = 0.9
title = "𝓥𝓲𝓫𝓮𝓬𝓻𝓪𝓯𝓽𝓮𝓭."
decorations = "Transparent"
startup_mode = "Maximized"
padding = { x = 0, y = 0 }
dynamic_padding = true
option_as_alt = "Both"

[font]
size = 18.5

[font.offset]
x = -1
y = 2

[font.normal]
family = "Spot Mono"
style = "Regular"

[font.bold]
family = "Spot Mono"
style = "Regular"

[font.italic]
family = "Spot Mono"
style = "Regular"

[cursor]
style = { shape = "Underline", blinking = "On" }
vi_mode_style = { shape = "Beam", blinking = "Off" }

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\\t"
save_to_clipboard = true

# Open URLs in the system browser with Command+Click.
[[hints.enabled]]
command = "open"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Command" }
binding = { key = "O", mods = "Control|Shift" }
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\s{-}\^⟨⟩`\\]+'

# Polish diacritics on either Option key, while keeping Option as Alt/Meta.
[[keyboard.bindings]]
key = "A"
mods = "Alt"
chars = "ą"

[[keyboard.bindings]]
key = "A"
mods = "Alt|Shift"
chars = "Ą"

[[keyboard.bindings]]
key = "C"
mods = "Alt"
chars = "ć"

[[keyboard.bindings]]
key = "C"
mods = "Alt|Shift"
chars = "Ć"

[[keyboard.bindings]]
key = "E"
mods = "Alt"
chars = "ę"

[[keyboard.bindings]]
key = "E"
mods = "Alt|Shift"
chars = "Ę"

[[keyboard.bindings]]
key = "L"
mods = "Alt"
chars = "ł"

[[keyboard.bindings]]
key = "L"
mods = "Alt|Shift"
chars = "Ł"

[[keyboard.bindings]]
key = "N"
mods = "Alt"
chars = "ń"

[[keyboard.bindings]]
key = "N"
mods = "Alt|Shift"
chars = "Ń"

[[keyboard.bindings]]
key = "O"
mods = "Alt"
chars = "ó"

[[keyboard.bindings]]
key = "O"
mods = "Alt|Shift"
chars = "Ó"

[[keyboard.bindings]]
key = "S"
mods = "Alt"
chars = "ś"

[[keyboard.bindings]]
key = "S"
mods = "Alt|Shift"
chars = "Ś"

[[keyboard.bindings]]
key = "X"
mods = "Alt"
chars = "ź"

[[keyboard.bindings]]
key = "X"
mods = "Alt|Shift"
chars = "Ź"

[[keyboard.bindings]]
key = "Z"
mods = "Alt"
chars = "ż"

[[keyboard.bindings]]
key = "Z"
mods = "Alt|Shift"
chars = "Ż"

# Word jump on Option+Left/Right (zsh/bash backward-word / forward-word).
# Without these bindings option_as_alt="Both" sends ESC[1;3D / ESC[1;3C,
# which most shells do not bind and may leak literal ";3D" into the prompt.
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001bf"

# Command to vc-frame: the product switcher (key contract v3).
# The host translates Command into kitty CSI-u with the Super modifier so
# vc-frame receives it in every mode, including LOCK.
[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001b[1;9D"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001b[1;9C"

[[keyboard.bindings]]
key = "Up"
mods = "Command"
chars = "\u001b[1;9A"

[[keyboard.bindings]]
key = "Down"
mods = "Command"
chars = "\u001b[1;9B"

[[keyboard.bindings]]
key = "Period"
mods = "Command|Shift"
chars = "\u001b[46;10u"

[[keyboard.bindings]]
key = "E"
mods = "Command"
chars = "\u001b[101;9u"

[scrolling]
# Retain enough output for long make/help dumps.
history = 50000
multiplier = 3

[mouse]
hide_when_typing = true
# Split the wheel by terminal buffer:
#   ~Alt (primary shell) -> Alacritty scrollback
#    Alt (TUI without mouse protocol) -> Up/Down keys
# Shift always forces terminal scrollback and bypasses app mouse reporting.
bindings = [
  { mouse = "WheelUp",   mode = "~Alt", action = "ScrollLineUp" },
  { mouse = "WheelDown", mode = "~Alt", action = "ScrollLineDown" },

  { mouse = "WheelUp",   mode = "Alt",  chars = "\u001bOA" },
  { mouse = "WheelDown", mode = "Alt",  chars = "\u001bOB" },

  { mouse = "WheelUp",   mods = "Shift", action = "ScrollLineUp" },
  { mouse = "WheelDown", mods = "Shift", action = "ScrollLineDown" },
]

# Composer: Shift+Enter inserts a newline.
[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001b\r"
