# Vendored from vc-frame/tools/alacritty/vc-frame.toml for frontier staging.
# Edit the vc-frame copy as source of truth, then re-sync this file.
#
# vc-frame host preset for Alacritty (>= 0.14, TOML config)
#
# Alacritty is the maintenance input of the Vibecrafted stack: vc-frame owns
# the chrome (rail, bars, tabs), the terminal stays a transparent host.
# Use via import so your own alacritty.toml keeps the last word:
#
#   [general]
#   import = ["~/.config/alacritty/vc-frame.toml"]
#
# Full rationale for every knob: docs/ALACRITTY_INTEGRATION.md

[general]
live_config_reload = true

[terminal]
# Land straight in the operator workspace. Comment this block out if you
# prefer a plain shell and want to start vc-frame by hand.
#
# Launch through a login zsh so the vc-frame *server* inherits SHELL and a
# full profile. Spawning `vc-frame` as the program itself left SHELL unset
# and every new pane fell back to bare /bin/sh.
shell = { program = "/bin/zsh", args = ["-lc", "exec vc-frame attach --create main"] }

[window]
# NON-NEGOTIABLE on macOS: without this, Option produces locale characters
# (ę, €, …) instead of Alt — Alt+e (Composer) and the Alt+Shift external-open
# click never reach vc-frame.
option_as_alt = "Both"
# Native-app illusion (lifted from the operator's daily config, 2026-07-29):
# the OS titlebar dissolves and the compact-bar becomes the de-facto window
# chrome — vc-frame reads as a native app instead of a program in a terminal.
title = "𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍."
decorations = "Transparent"
startup_mode = "Maximized"
blur = true
opacity = 0.9
# The chrome paints its own background; zero padding avoids visible seams.
padding = { x = 0, y = 0 }
dynamic_padding = true

[font]
# Any complete monospace works — the chrome glyphs (◉ ○ ⚿ ⌁ │ ·) are plain
# text-presentation Unicode, not emoji and not private-use icons. A Nerd Font
# is a safe superset if you also want powerline/devicon coverage.
# normal = { family = "JetBrainsMono Nerd Font" }
size = 13.0

[scrolling]
# Enough history for long make/help dumps at the host prompt.
history = 50000
multiplier = 3

[mouse]
hide_when_typing = true
# Split wheel by terminal buffer (debugged 2026-08-06):
#   ~Alt (primary / normal shell) → Alacritty scrollback
#    Alt (TUI without mouse protocol: Atuin, less, vim, …) → Up/Down keys
# Shift always forces terminal scrollback (bypasses app mouse reporting).
#
# Do NOT keep the interactive shell permanently on the alternate buffer
# (no smcup wrapper for the whole session) — that kills host scrollback and
# makes the wheel look like arrow keys. TUIs enter/leave Alt themselves.
# See tools/alacritty/launch-primary-shell.zsh and docs/ALACRITTY_INTEGRATION.md.
bindings = [
  { mouse = "WheelUp",   mode = "~Alt", action = "ScrollLineUp" },
  { mouse = "WheelDown", mode = "~Alt", action = "ScrollLineDown" },

  { mouse = "WheelUp",   mode = "Alt",  chars = "\u001bOA" },
  { mouse = "WheelDown", mode = "Alt",  chars = "\u001bOB" },

  { mouse = "WheelUp",   mods = "Shift", action = "ScrollLineUp" },
  { mouse = "WheelDown", mods = "Shift", action = "ScrollLineDown" },
]

# ─── option_as_alt survival kit ─────────────────────────────────────────────
# `option_as_alt = "Both"` takes the whole Option layer away from macOS text
# input. Locale characters typed with Option are re-injected below (Polish
# shown — the operator's daily layer; adapt or delete for your locale).
# Without these, Option+letter reaches vc-frame as Alt and the diacritic
# never appears.
#
# Word-jump is NOT host-bound: Alt+Left/Right are the product key-contract
# for tabs in unlocked modes, and LOCK-mode word-jump is done inside
# vc-frame (`Write 27 98/102` in assets/config/default.kdl). Host chars for
# Alt+arrows would steal those keys from vc-frame.
[[keyboard.bindings]]
key = "A"
mods = "Alt"
chars = "ą"

[[keyboard.bindings]]
key = "A"
mods = "Alt|Shift"
chars = "Ą"

[[keyboard.bindings]]
key = "C"
mods = "Alt"
chars = "ć"

[[keyboard.bindings]]
key = "C"
mods = "Alt|Shift"
chars = "Ć"

[[keyboard.bindings]]
key = "E"
mods = "Alt"
chars = "ę"

[[keyboard.bindings]]
key = "E"
mods = "Alt|Shift"
chars = "Ę"

[[keyboard.bindings]]
key = "L"
mods = "Alt"
chars = "ł"

[[keyboard.bindings]]
key = "L"
mods = "Alt|Shift"
chars = "Ł"

[[keyboard.bindings]]
key = "N"
mods = "Alt"
chars = "ń"

[[keyboard.bindings]]
key = "N"
mods = "Alt|Shift"
chars = "Ń"

[[keyboard.bindings]]
key = "O"
mods = "Alt"
chars = "ó"

[[keyboard.bindings]]
key = "O"
mods = "Alt|Shift"
chars = "Ó"

[[keyboard.bindings]]
key = "S"
mods = "Alt"
chars = "ś"

[[keyboard.bindings]]
key = "S"
mods = "Alt|Shift"
chars = "Ś"

[[keyboard.bindings]]
key = "X"
mods = "Alt"
chars = "ź"

[[keyboard.bindings]]
key = "X"
mods = "Alt|Shift"
chars = "Ź"

[[keyboard.bindings]]
key = "Z"
mods = "Alt"
chars = "ż"

[[keyboard.bindings]]
key = "Z"
mods = "Alt|Shift"
chars = "Ż"

# ─── Cmd → vc-frame: the product switcher (key-contract v3) ─────────────────
# Cmd+arrows and Cmd+E are empty real estate in every terminal — no shell,
# no TUI and no diacritics layer ever sees them. The host translates them
# into kitty CSI-u sequences with the super bit (modifier param 9 = 1+8);
# the vc-frame keyboard parser decodes these natively as Super+key, so the
# switcher works in EVERY mode, LOCK included.
#   Cmd+←/→  previous/next tab
#   Cmd+↑/↓  previous/next session
#   Cmd+E    Command Composer
[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001B[1;9D"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001B[1;9C"

[[keyboard.bindings]]
key = "Up"
mods = "Command"
chars = "\u001B[1;9A"

[[keyboard.bindings]]
key = "Down"
mods = "Command"
chars = "\u001B[1;9B"

[[keyboard.bindings]]
key = "E"
mods = "Command"
chars = "\u001B[101;9u"

# Word-jump for the writer: Alt+arrows are NOT product keys (contract v3
# moved the switcher to Cmd), so the host may translate them for the shell.
# Without these, option_as_alt="Both" sends ESC[1;3D / ESC[1;3C which most
# shells don't bind, leaking literal ";3D" into the prompt.
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001Bf"

# Multiline drafting: Shift+Enter inserts a newline instead of submitting
# (pairs with the Composer flow for quick inline multi-line commands).
[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001B\r"

# ─── Host URL / hyperlink hints ─────────────────────────────────────────────
# While mouse-reporting is active, Alacritty requires Shift to activate hints.
# That is the official host-side browser/open gesture:
#   Shift+click URL / OSC 8 hyperlink → open (macOS `open`)
# vc-frame still owns bare Click and Alt+Shift / Ctrl+Shift for paths without
# OSC 8. Keep mouse.enabled = true — without it Shift+click is a lottery of
# Alacritty defaults across versions.
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
hyperlinks = true
post_processing = true
# macOS: `open` resolves http → browser and file:// → system app (Pensieve, etc.)
# Env-driven opener layer: set VC_OPENER in your shell profile to route
# links/files into your app of choice (e.g. "pensieve --wait", an editor,
# a specific browser); unset it and macOS `open` resolves the default app.
# The login zsh (-l) loads your profile, so PATH and VC_OPENER are yours.
command = { program = "/bin/zsh", args = ["-lc", "exec ${VC_OPENER:-open} \"$0\""] }
# iTerm-style: hold Cmd and click a link to open it. When an app owns the
# mouse (reporting active), Shift+Cmd+click is the guaranteed fallback.
mouse = { enabled = true, mods = "Command" }
binding = { key = "U", mods = "Control|Shift" }

# ─── What is deliberately NOT here ──────────────────────────────────────────
# - No bare Shift+click *keyboard* bindings: terminals reserve Shift+click to
#   bypass mouse reporting so host hints can fire (see [hints] above).
# - No Ctrl+arrow host bindings: outside LOCK the engine binds them as the
#   muscle-memory switcher lane; in LOCK they belong to the pane. Whether
#   macOS Mission Control eats them first is the operator's OS-level call —
#   the contract lane that always works is Cmd (see above).
# - No colors: vc-frame themes carry their own RGB. If you want the window
#   background to match the chrome ground, import a matching Alacritty theme
#   generated from your vc-frame theme (see docs/THEMES_GUIDE.md roadmap).
# - Ctrl+arrows remain optional LOCK bonus binds in vc-frame. Mission Control
#   may own them on macOS; the declared product contract is Alt+arrows, so
#   operators may leave Mission Control defaults alone.

