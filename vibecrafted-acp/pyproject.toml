[project]
name = "vibecrafted-acp"
version = "3.7.0"
description = "Thin ACP v1 adapter over the Vibecrafted evidence runtime."
requires-python = ">=3.11"
dependencies = ["vibecrafted>=3.7.0"]

[project.scripts]
vibecrafted-acp = "vibecrafted_acp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibecrafted_acp"]

[tool.uv.sources]
vibecrafted = { workspace = true }
