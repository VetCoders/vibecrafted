[package]
name = "voc"
version = "0.1.1"
autobins = false
edition.workspace = true
license = "MIT"
authors.workspace = true
description = "Voc Agent — the Rust terminal cockpit for Vibecrafted"
readme = "README.md"
homepage = "https://vibecrafted.io"
repository = "https://github.com/VetCoders/vc-tui"
documentation = "https://docs.rs/voc"

[[bin]]
name = "voc"
path = "src/main.rs"

[dependencies]
rmcp-mux = { path = "../mux-agent", version = "0.4.0", package = "rmcp-mux" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
notify = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
