# Pre-tag rehearsal of release.yml's source-gate. Four tags burned in one
# night (v4.2.0..v4.2.3, 2026-08-21/22) because the only place the full gate
# suite ever ran on a bare macOS image was the immutable tag itself — each tag
# died one step further along. The previous incarnation (core-macos.yml,
# 870fb9b0) covered only `make test-core` and was deleted in 7da2e376 without
# a note; v4.2.2/v4.2.3 died in `make test`, which it never ran anyway.
# This workflow runs the same gate steps, same runner, on the release PR —
# so the tag confirms a green check instead of discovering the suite.
#
# Two rules keep that promise true:
#
#   1. EVERY step release.yml's source-gate runs after its immutable-tag
#      preamble is rehearsed here, in the same order — including the last one.
#      The publication-boundary step is the one that has never once executed on
#      any tag (every tag died before reaching it), which makes it the single
#      most important step to rehearse, not the one to leave out. A contract
#      test compares both step lists, so the next divergence is a red PR rather
#      than a discovery on the tag.
#   2. A release PR always rehearses. The paths filter below is an
#      optimisation for ordinary PRs; it must never be the reason a release
#      goes to a tag unrehearsed. It is kept wide, and `release/*` pushes run
#      unconditionally on top — an allowlist only protects the cuts whose
#      shape someone predicted, and the next release need not have that shape.
#
# NOT wired to `merge_group` on purpose: this is an early-warning check on the
# release PR, and the tag gate re-runs everything anyway, so paying a macOS
# job per queue entry buys nothing. If this workflow is ever made a REQUIRED
# context, add `merge_group:` in the same commit — the queue waits for required
# contexts on the queue head, and a required context that never reports there
# deadlocks every merge until check_response_timeout kills it (see
# install-linux.yml).
name: Release gate rehearsal (macOS)

on:
  push:
    branches:
      - "release/*"
  pull_request:
    branches:
      - main
    paths:
      - "vibecrafted-core/**"
      - "vibecrafted-mcp/**"
      - "vibecrafted-acp/**"
      - "vibecrafted-app/**"
      - "vibecrafted-server/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/**"
      - "docker/**"
      - "install.sh"
      - "install.toml"
      - "Makefile"
      - "VERSION"
      - "**/VERSION"
      - "plugin.json"
      - "**/pyproject.toml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "vetcoders.zsh"
      - "CHANGELOG.md"
      - "docs/RELEASE_KICKOFF.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/gate-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

# A release PR gets pushed repeatedly while it is being fixed; without this,
# every push stacks another uncancelled hour-long macOS job behind the one
# whose answer nobody wants any more.
concurrency:
  group: gate-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-rehearsal:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Same depth as release.yml: the gate must not differ from the tag
          # run in anything a step could observe, and `make portable` reads the
          # checkout's git state.
          fetch-depth: 0
          persist-credentials: false

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # The same steps release.yml's source-gate runs after its immutable-tag
      # preamble, in the same order, so a red here is a red there.
      - name: Run shell checks
        run: make check

      - name: Run unified product contract gate
        run: make unified-product-contract-gate

      - name: Run core runtime tests
        run: make test-core

      - name: Run Semgrep security gate
        run: make semgrep

      - name: Run installer and product tests
        run: make test

      - name: Build the portable release channel
        run: make portable

      # release.yml's final step, rehearsed here for the first time. Its own
      # comment records that it has never executed on any tag: it arrived in
      # ef700e52 (3.7.1) and every tag since died earlier. A step that has
      # never run is not a passing step — it is an unknown, and leaving the
      # single unknown out of the rehearsal is how a fifth tag dies at the
      # last step with the whole suite already green behind it.
      - name: Confirm publication boundary for both channels
        run: |
          set -euo pipefail
          test -x scripts/publish-vibecrafted-release.sh
          test -x scripts/build-portable-release.sh
          grep -nE 'Vibecrafted_.*YYYYMMDD|DMG_NAME|\.dmg\.sha256' \
            scripts/build-vibecrafted-release.sh \
            scripts/publish-vibecrafted-release.sh \
            docs/RELEASE_KICKOFF.md
          grep -nE 'PORTABLE_NAME|portable\.tar\.gz|portable-output\.json' \
            scripts/build-portable-release.sh \
            scripts/publish-vibecrafted-release.sh \
            docs/RELEASE_KICKOFF.md
