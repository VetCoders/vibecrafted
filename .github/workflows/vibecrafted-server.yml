name: vibecrafted-server

on:
  push:
    paths:
      - "vibecrafted-server/**"
      - ".github/workflows/vibecrafted-server.yml"
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
    paths:
      - "vibecrafted-server/**"
      - ".github/workflows/vibecrafted-server.yml"
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vc-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-core:
    name: control-core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vibecrafted-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: vibecrafted-server
      - name: Agent docs present
        run: |
          test -s AGENTS.md
          test -s llms.txt
      - name: Test control-core
        run: cargo test -p control-core
      - name: Check web (ssr)
        run: cargo check -p vibecrafted-server-web --features ssr
