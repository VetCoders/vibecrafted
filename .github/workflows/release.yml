name: Release source gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-gate:
    # The product-contract self-test compiles, signs, and inspects a real
    # Mach-O fixture. Keep the immutable tag gate on the platform we ship.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          release_tag_ref="refs/vibecrafted-release-tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:$release_tag_ref"
          test "$(git cat-file -t "$release_tag_ref")" = "tag"
          test "$(git rev-list -n 1 "$release_tag_ref")" = "$GITHUB_SHA"

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run shell checks
        run: make check

      - name: Run unified product contract gate
        run: make unified-product-contract-gate

      - name: Run core runtime tests
        run: make test-core

      - name: Run Semgrep security gate
        run: make semgrep

      - name: Run installer and product tests
        run: make test

      - name: Confirm macOS publication boundary
        run: |
          set -euo pipefail
          test -x scripts/publish-vibecrafted-release.sh
          command rg -n 'Vibecrafted_.*YYYYMMDD|DMG_NAME|\.dmg\.sha256' \
            scripts/build-vibecrafted-release.sh \
            scripts/publish-vibecrafted-release.sh \
            docs/RELEASE_KICKOFF.md
