name: Release source gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run shell checks
        run: make check

      - name: Run unified product contract gate
        run: make unified-product-contract-gate

      - name: Run core runtime tests
        run: make test-core

      - name: Run Semgrep security gate
        run: make semgrep

      - name: Run installer and product tests
        run: make test

      - name: Confirm macOS publication boundary
        run: |
          set -euo pipefail
          test ! -e dist/Vibecrafted.dmg
          test -x scripts/publish-vibecrafted-release.sh
          command rg -n 'Vibecrafted\.dmg' scripts/publish-vibecrafted-release.sh
