schema = "vibecrafted.dispatch.v1"

[meta]
name = "d1-schema-parser"
description = "Stage0 maximum fixture for dispatch schema parser."
repo = "/Users/tester/vc-workspace/Vetcoders/vibecrafted"
baseline = { branch = "feat/runtime-integration", head = "9365d7c" }
reports_dir = "/Users/tester/.vibecrafted/artifacts/vetcoders/vibecrafted/2026_0610/reports"
tracker = "/Users/tester/.vibecrafted/artifacts/vetcoders/vibecrafted/2026_0610/plans/stage0-tracker.md"

[policy]
repair_rounds = 1
on_critical_fail = "break"
on_timeout = "repair"
concurrency = 2
allow_concurrency = true
await = { poll_s = 90, timeout_min = 90 }
verify_executor = "supervisor"

[workflow_map]
audit = "review"

[common]
text = """
ŚRODOWISKO: repo {repo}, bieżąca gałąź; zero worktree, zero branch switching.
RAPORT: {reports_dir}/{id}_report.md
BATON: {baton}
"""

[[phases]]
title = "Foundation"
detail = "Parser, prompt rendering, baton contract."

[[phases]]
title = "Audit"
detail = "Read-only verifier consumes accumulated states."

[[phases]]
title = "Runtime"
detail = "Executor and supervisor cuts."

[[phases]]
title = "Stage2"
detail = "Self-replay read cut."

[[cuts]]
id = "d1-schema-parser"
phase = "Foundation"
critical = true
agent = "codex"
workflow = "implement"
brief = "stage0-brief.md"
extra = "Cut {id}; agent {agent}; workflow {workflow}; repo {repo}."
recovery = { on = "[!]", goto = "read-audit", max_loops = 1 }

  [[cuts.verify]]
  run = "cd {repo} && make dispatch-test"
  expect = { contains = "passed", not_contains = "FAILED", matches = "[0-9]+ passed", exit_code = 0 }

[[cuts]]
id = "read-audit"
phase = "Audit"
agent = "gemini"
workflow = "audit"
mode = "read"
observational = true
prompt = "Review baton states and report whether the parser contract is complete."

[[cuts]]
id = "d2-dispatch-doctor"
phase = "Foundation"
agent = "codex"
workflow = "implement"
prompt = "Implement the dispatch doctor refusal boundary."

  [[cuts.verify]]
  run = "cd {repo} && make dispatch-test"
  expect = { matches = "(passed|ok)" }

[[cuts]]
id = "d3-verifier-executor"
phase = "Runtime"
agent = "claude"
workflow = "implement"
prompt = "Implement verifier execution and evidence."

  [[cuts.verify]]
  run = "cd {repo} && make dispatch-test"
  expect = { matches = "(passed|ok)" }

[[cuts]]
id = "d4-supervisor-loop"
phase = "Runtime"
critical = true
agent = "claude"
workflow = "implement"
prompt = "Implement the supervisor loop."

  [[cuts.verify]]
  run = "cd {repo} && make dispatch-test"
  expect = { matches = "(passed|ok)" }

[[cuts]]
id = "d5-cli-surface"
phase = "Runtime"
agent = "codex"
workflow = "implement"
prompt = "Implement the CLI surface."

  [[cuts.verify]]
  run = "cd {repo} && make dispatch-test"
  expect = { matches = "(passed|ok)" }

[[cuts]]
id = "d7-stage2-self-replay"
phase = "Stage2"
agent = "gemini"
workflow = "audit"
mode = "read"
prompt = "Review the final dispatch result. Do not edit code and do not commit."

  [[cuts.verify]]
  run = "true"
  expect = { exit_code = 0 }
