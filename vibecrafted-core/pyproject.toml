[project]
name = "vibecrafted"
version = "3.2.0rc0"
description = "Core Python library for Vibecrafted runtime and synthesis surfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vibecrafted = "vibecrafted_core.cli:main"
vc-agents = "vibecrafted_core.wrappers:agents_main"
vc-followup = "vibecrafted_core.wrappers:followup_main"
vc-implement = "vibecrafted_core.wrappers:implement_main"
vc-marbles = "vibecrafted_core.wrappers:marbles_main"
vc-prune = "vibecrafted_core.wrappers:prune_main"
vc-research = "vibecrafted_core.wrappers:research_main"
vc-research-await = "vibecrafted_core.wrappers:research_await_main"
vc-research-synthesize = "vibecrafted_core.wrappers:research_synthesize_main"
vc-review = "vibecrafted_core.wrappers:review_main"
vc-sandbox = "vibecrafted_core.wrappers:sandbox_main"
vc-scaffold = "vibecrafted_core.wrappers:scaffold_main"
vc-cron = "vibecrafted_core.cron:main"
vc-loop = "vibecrafted_core.loop:main"
vc-ship = "vibecrafted_core.ship:main"
vibecrafted-resume = "vibecrafted_core.wrappers:resume_main"
vibecrafted-compact-hook = "vibecrafted_core.compact_hooks:main"

[project.optional-dependencies]
sandbox = ["aiohttp >= 3.9"]
# macOS-only iTerm2 / locterm AutoLaunch plugin.
# Not in the default install — opt-in via `pip install '.[iterm2]'`.
iterm2 = ["iterm2 >= 2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "vibecrafted_core/runtime/**",
    "vibecrafted_core/skills/**",
    "vibecrafted_core/deck/vibecrafted",
]

[tool.hatch.build.targets.wheel]
packages = ["vibecrafted_core"]
